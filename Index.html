 <div class="container">

    <div class="campo">

        <input id="codigo" type="text" placeholder="digite o código do imóvel">
    </div>




    <div class="campo">
    
    <label for="tipos">TIPOS:</label>
    <select name="tipos" id="tipos">
      <option value="Apartamento">Apartamento</option>

    </select>

     <div class="campo">

   </select>

    </div>

        <label for="status">STATUS:</label>
